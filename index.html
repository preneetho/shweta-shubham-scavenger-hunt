<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Shweta Shubham Scavenger Hunt 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 560px;
      margin: 15px auto;
      padding: 26px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .title {
      text-align: center;
      font-size: 23px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 24px;
    }

    .team {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .red {
      color: #d32f2f;
    }

    .blue {
      color: #1565c0;
    }

    .green {
      color: #2e7d32;
    }

    .orange {
      color: #ef6c00;
    }

    .clue-number {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 28px;
    }

    .instruction {
      text-align: center;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    #pin {
      display: block;
      width: 190px;
      max-width: 100%;
      margin: 0 auto;
      padding: 14px;
      font-size: 25px;
      text-align: center;
      letter-spacing: 7px;
      border: 2px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    #pin:focus {
      border-color: #555;
    }

    button {
      display: block;
      margin: 18px auto 0;
      padding: 14px 28px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      min-height: 22px;
      text-align: center;
      color: #d32f2f;
      font-weight: bold;
      margin-top: 15px;
    }

    #clueSection {
      display: none;
    }

    .section-label {
      font-size: 20px;
      font-weight: 800;
      margin-top: 22px;
      margin-bottom: 10px;
    }

    .clue-content {
      font-size: 19px;
      line-height: 1.55;
    }

    .text-line {
      margin-bottom: 7px;
    }

    .blank-line {
      height: 10px;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    .final-message {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #f7f7f7;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        margin: 10px auto;
        padding: 24px 18px;
        border-radius: 14px;
      }

      .title {
        font-size: 21px;
      }

      .team {
        font-size: 28px;
      }

      .clue-content {
        font-size: 18px;
      }
    }
  </style>
</head>


<body>

<div class="card">

  <div class="title">
    Shweta Shubham Scavenger Hunt 2026
  </div>

  <div
    id="teamName"
    class="team">
  </div>

  <div
    id="clueNumber"
    class="clue-number">
  </div>


  <!-- PIN SCREEN -->

  <div id="pinSection">

    <div class="instruction">
      Enter your Team PIN to unlock the clue.
    </div>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="4"
      autocomplete="off"
      placeholder="••••"
    >

    <button onclick="checkPin()">
      Unlock Clue
    </button>

    <div
      id="error"
      class="error">
    </div>

  </div>


  <!-- CLUE SCREEN -->

  <div id="clueSection">

    <div
      id="clueContent"
      class="clue-content">
    </div>

    <div
      id="finalMessage"
      class="final-message"
      style="display:none;">
    </div>

    <div class="footer">
      Good luck, detectives! 🔎
    </div>

  </div>

</div>


<script>

/* =====================================================
   TEAM PINS
   ===================================================== */

const TEAM_PINS = {
  red: "3421",
  blue: "5690",
  green: "6709",
  orange: "0363"
};


/* =====================================================
   ALL 10 CLUES
   ===================================================== */

const CLUES = {

  1: {
    clue: [
      "Some came here to cut cakes,",
      "some to catch up over food,",
      "and some arrived dressed up for an afternoon with the ladies.",
      "Plates got lighter, glasses got emptier,",
      "but the conversations only grew louder.",
      "To reach the place you seek, let the number of seasons guide your rise.",
      "Find the place. Your next clue is waiting around there."
    ],

    task: [
      "Once you reach the location, click a selfie with your entire team.",
      "Send the photo to your Hunt Master as proof of task completion."
    ]
  },


  2: {
    clue: [
      "Your next destination is where people enter and leave the community.",
      "But which one?",
      "Your hand carries the answer.",
      "Count what nature gave it, and let that number guide you.",
      "Reach the right spot. Your next clue is waiting there."
    ],

    task: [
      "Obtain a receipt/bill generated after 7:00 PM today, clearly showing the current date and time.",
      "Click a selfie with all team members, with the receipt clearly visible from the above location.",
      "Send the photo to your Hunt Master as proof of task completion."
    ]
  },


  3: {
    clue: [
      "My name is Anahat Singh.",
      "If Swetha Shubham were my home, there is one place I would keep returning to.",
      "Here, a wall is not a boundary but a partner.",
      "What you send away often comes racing back.",
      "Two may enter to compete, but the walls play along too.",
      "Find my favourite place. Your next clue is waiting there."
    ],

    task: [
      "Once there, take a selfie with your entire team at the location.",
      "Send the photo to your Hunt Master as proof of task completion."
    ]
  },


  4: {
    clue: [
      "I don’t belong to any one flat,",
      "yet I deal with matters of them all.",
      "Requests, records and resident concerns",
      "often find their way to my door.",
      "Find me. Your next clue is waiting there."
    ],

    task: [
      "Record a video of one team member cycling continuously for at least 30 seconds.",
      "Then click a selfie with your entire team and the cycle.",
      "Send both the video and team photo to your Hunt Master as proof of task completion."
    ]
  },


  5: {
    clue: [
      "I notice those who come and go.",
      "I stay alert while others relax.",
      "I watch without wandering,",
      "and keeping the society safe is my everyday job.",
      "Find where I belong. Your next clue is waiting there."
    ],

    task: [
      "21st June celebrates an ancient practice that India shared with the world.",
      "Solve what it is, then bring the one thing you would normally unroll before beginning the practice.",
      "Get 3 team members into a blissful pose with your newly found companion.",
      "Click a picture and send it to your Hunt Master as proof of task completion."
    ]
  },


  6: {
    clue: [
      "I hold plenty, yet I am never thirsty.",
      "People come to me to move, yet often remain in the same place.",
      "Some race across me, some simply float,",
      "and the deeper you go, the quieter the world becomes.",
      "Find me. Your next clue is waiting around me."
    ],

    task: [
      "Once you reach the right place, gather your entire team beside me and strike your best pose.",
      "Click a team photo and send it to your Hunt Master as proof of task completion."
    ]
  },


  7: {
    clue: [
      "I have many seats, but no dining table.",
      "Everyone faces one direction, but no teacher stands there.",
      "Sometimes I am silent, sometimes I come alive with a crowd.",
      "I have no roof to hide under, yet I was made to bring people together.",
      "Find me. Your next clue is waiting there."
    ],

    task: [
      "Once you reach the right place, your challenge begins.",
      "Capture pictures of 3 different cars belonging to the same brand.",
      "There is one catch: at least one teammate must appear in every picture.",
      "Once all 3 are captured, send the complete set of photos to your Hunt Master as proof of task completion."
    ]
  },


  8: {
    clue: [
      "I hold something everyone needs,",
      "yet no one comes here to drink from me.",
      "I quietly keep a reserve for hundreds of homes,",
      "while the taps far above depend on me.",
      "But don’t look towards the sky for me.",
      "From where the cars rest, let twice below zero guide your way.",
      "Figure out this place.",
      "Your next clue is waiting around there."
    ],

    task: [
      "Find 2 different varieties of something that:",
      "I grow from a flower.",
      "I may hide one seed or many.",
      "I can be juicy, pulpy, sweet or tangy.",
      "And once I ripen, I rarely stay uneaten for long.",
      "Got them?",
      "Now head to the destination you decoded.",
      "Take a picture with your entire team at the destination, with both varieties clearly visible.",
      "Send the photo to your Hunt Master as proof of task completion."
    ]
  },


  9: {
    clueTitle: "CLUE: THE GREEN CIRCUIT",

    clue: [
      "Eight green corners are scattered around your community. Your mission is to leave none of them unexplored.",
      "Only one of the eight holds what you are looking for.",
      "Keep your eyes sharp and let the seventh stop reward those who have come this far."
    ],

    task: [
      "Visit all eight parks in the community.",
      "Click a group selfie with the entire team at each park.",
      "That means eight parks = eight team selfies.",
      "Send all eight photos to the Hunt Master, find the hidden clue, and continue your hunt."
    ]
  },


  10: {
    clue: [
      "I am available 365 days a year, quietly watching over you all.",
      "Before a new beginning, journey, or important mission, many come looking for my blessing and sign-off.",
      "I’m not on Teams, I never reply to emails, and you’ll never find my name in an approval workflow.",
      "The first approver of every good beginning awaits.",
      "Figure out who I am and find my shrine."
    ],

    task: [
      "Take a selfie with the entire team at the shrine and send it to the Hunt Master."
    ],

    final: [
      "Your hunt for today is complete!",
      "Head back and take some well-earned rest, but don’t disappear without informing the Hunt Master."
    ]
  }

};


/* =====================================================
   GET TEAM + QUESTION FROM QR URL
   ===================================================== */

const params =
  new URLSearchParams(window.location.search);

const team =
  (params.get("team") || "").toLowerCase();

const questionNumber =
  parseInt(params.get("q") || "0", 10);


/* =====================================================
   VALIDATE QR URL
   ===================================================== */

if (
  !TEAM_PINS.hasOwnProperty(team) ||
  !CLUES.hasOwnProperty(questionNumber)
) {

  document.body.innerHTML = `
    <div style="
      font-family:Arial;
      text-align:center;
      padding:50px;
    ">
      <h2>Invalid Scavenger Hunt QR Code</h2>
      <p>Please check the QR code and try again.</p>
    </div>
  `;

} else {

  initialisePage();

}


/* =====================================================
   INITIALISE PAGE
   ===================================================== */

function initialisePage() {

  const teamName =
    document.getElementById("teamName");

  teamName.textContent =
    team.toUpperCase() + " TEAM";

  teamName.classList.add(team);


  document.getElementById(
    "clueNumber"
  ).textContent =
    "Clue #" + questionNumber;


  /*
   * Authentication is remembered separately
   * for each team on this device/browser.
   */

  const authenticated =
    localStorage.getItem(
      "ssScavengerAuthenticated_" + team
    );


  if (authenticated === "yes") {

    showClue();

  } else {

    showPinScreen();

  }

}


/* =====================================================
   CHECK TEAM PIN
   ===================================================== */

function checkPin() {

  const enteredPin =
    document
      .getElementById("pin")
      .value
      .trim();


  const error =
    document.getElementById("error");


  error.textContent = "";


  if (!/^\d{4}$/.test(enteredPin)) {

    error.textContent =
      "Please enter your 4-digit PIN.";

    return;

  }


  if (
    enteredPin === TEAM_PINS[team]
  ) {

    /*
     * Remember authentication for this team.
     */

    localStorage.setItem(
      "ssScavengerAuthenticated_" + team,
      "yes"
    );


    /*
     * PIN is NOT stored.
     */

    showClue();

  } else {

    error.textContent =
      "Incorrect PIN. Try again.";


    document
      .getElementById("pin")
      .value =
        "";


    document
      .getElementById("pin")
      .focus();

  }

}


/* =====================================================
   ENTER KEY SUPPORT
   ===================================================== */

document
  .getElementById("pin")
  ?.addEventListener(
    "keyup",
    function(event) {

      if (event.key === "Enter") {
        checkPin();
      }

    }
  );


/* =====================================================
   SHOW PIN SCREEN
   ===================================================== */

function showPinScreen() {

  document
    .getElementById("pinSection")
    .style.display =
      "block";


  document
    .getElementById("clueSection")
    .style.display =
      "none";

}


/* =====================================================
   SHOW CLUE
   ===================================================== */

function showClue() {

  document
    .getElementById("pinSection")
    .style.display =
      "none";


  document
    .getElementById("clueSection")
    .style.display =
      "block";


  renderClue();

}


/* =====================================================
   RENDER CLUE
   ===================================================== */

function renderClue() {

  const data =
    CLUES[questionNumber];


  const container =
    document.getElementById(
      "clueContent"
    );


  container.innerHTML = "";


  /*
   * CLUE heading
   */

  const clueHeading =
    document.createElement("div");

  clueHeading.className =
    "section-label";

  clueHeading.textContent =
    data.clueTitle || "CLUE";

  container.appendChild(
    clueHeading
  );


  /*
   * Clue lines
   */

  data.clue.forEach(
    function(line) {

      addTextLine(
        container,
        line
      );

    }
  );


  /*
   * TASK heading
   */

  const taskHeading =
    document.createElement("div");

  taskHeading.className =
    "section-label";

  taskHeading.textContent =
    "TASK";

  container.appendChild(
    taskHeading
  );


  /*
   * Task lines
   */

  data.task.forEach(
    function(line) {

      addTextLine(
        container,
        line
      );

    }
  );


  /*
   * Final message for Q10
   */

  const finalMessage =
    document.getElementById(
      "finalMessage"
    );


  if (
    data.final &&
    data.final.length > 0
  ) {

    finalMessage.innerHTML = "";


    data.final.forEach(
      function(line) {

        const div =
          document.createElement("div");

        div.textContent =
          line;

        div.style.marginBottom =
          "7px";

        finalMessage.appendChild(
          div
        );

      }
    );


    finalMessage.style.display =
      "block";


    /*
     * Q10 is completed, so normal
     * Good luck footer isn't needed.
     */

    document.querySelector(
      ".footer"
    ).textContent =
      "Congratulations! 🎉";

  }

}


/* =====================================================
   ADD SAFE TEXT LINE
   ===================================================== */

function addTextLine(
  container,
  text
) {

  const div =
    document.createElement("div");


  div.className =
    "text-line";


  /*
   * textContent prevents HTML/script
   * from being executed.
   */

  div.textContent =
    text;


  container.appendChild(
    div
  );

}

</script>

</body>
</html>
